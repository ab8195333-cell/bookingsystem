name: Full-Stack CI Pipeline (Laravel & Next.js)

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. اختبارات الباك إند (Laravel)
  # ==========================================
  laravel-backend-tests:
    name: Backend Tests (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Prepare SQLite Database & Run Migrations
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      - name: Run Artisan Tests (Strict Failure)
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          SESSION_DRIVER: array

  # ==========================================
  # 2. اختبارات الفرونت إند (Next.js)
  # ==========================================
  nextjs-frontend-tests:
    name: Frontend Tests & Build (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: booking-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: booking-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npx next lint --dir .

      - name: Run Frontend Tests
        run: npm test -- --passWithNoTests

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://bookingsystem-krms.onrender.com/api