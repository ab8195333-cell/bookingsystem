name: Laravel CI Pipeline

on:
  push:
    branches: [ main, master ] # يتم تشغيل المسار تلقائياً عند الـ Push إلى هذه الفروع
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # إذا كان مشروعك يحتاج قاعدة بيانات MySQL أثناء الاختبار
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing_db
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد بيئة PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql, pdo
        coverage: none

    # 3. تثبيت حزم Composer
    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    # 4. ضبط إعدادات البيئة للاختبار
    - name: Prepare Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    # 5. تشغيل الاختبارات (Tests)
    - name: Run Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: testing_db
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan test