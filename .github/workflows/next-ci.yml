Name: Next.js Frontend CI Pipeline

on:
  push:
    branches: [ main, master ] # تشغيل المسار عند الـ Push إلى هذه الفروع
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./booking-frontend # تحديد مجلد الفرونت إند ليعمل داخله

    steps:
    # 1. سحب الكود من مستودع GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد بيئة Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # إصدار Node.js المناسب لـ Next.js
        cache: 'npm'       # تسريع التثبيت باستخدام الكاش
        cache-dependency-path: booking-frontend/package-lock.json

    # 3. تثبيت الحزم والمكتبات (Dependencies)
    - name: Install dependencies
      run: npm ci

    # 4. فحص جودة الكود وتنسيقه (Linting) بصورة صارمة
    - name: Run ESLint Check
      run: npm run lint

    # 5. التجربة الفعلية لبناء المشروع (Build Check)
    # تضمن عدم وجود أي أخطاء تمنع النشر على Render أو Vercel
    - name: Build Next.js Application
      run: npm run build
      env:
        # إدخال متغيرات بيئة وهمية لأجل عملية البناء
        NEXT_PUBLIC_API_URL: https://bookingsystem-krms.onrender.com/api